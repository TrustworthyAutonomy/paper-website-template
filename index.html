<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper</title>
    <meta name="description" content="Project page for a research paper" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1 id="paper-title">Paper title</h1>
        <p class="authors" id="authors"></p>
        <p class="affiliations" id="affiliations"></p>
        <p class="venue" id="venue"></p>
        <div class="links" id="links"></div>
      </header>

      <figure class="teaser" id="teaser" hidden>
        <img id="teaser-image" src="" alt="" />
        <figcaption id="teaser-caption"></figcaption>
      </figure>

      <section id="overview">
        <h2>Overview</h2>
        <p id="abstract"></p>
      </section>

      <div id="sections"></div>

      <section id="citation">
        <h2>Citation</h2>
        <div class="bib-wrap">
          <button type="button" class="copy-btn" id="copy-bibtex">Copy</button>
          <pre><code id="bibtex"></code></pre>
        </div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
